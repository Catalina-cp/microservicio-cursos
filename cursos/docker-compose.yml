services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-cursos
    ports:
      - "5672:5672"
      - "15672:15672"

  cursos-app:
    image: catalinacabezas/my-app:latest
    container_name: cursos-app
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
